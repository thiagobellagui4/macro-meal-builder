<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro Meal Builder</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #2e7d32;
      --accent-hover: #388e3c;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 30px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .full-width { grid-column: span 2; }
    .val { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    .sub { font-size: 0.8rem; color: var(--subtext); }
    
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: var(--subtext); }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      background-color: var(--accent);
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    button:active { background-color: var(--accent-hover); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); }
    th { color: var(--subtext); }
    .btn-del {
      background: none; border: none; color: #ff5252;
      padding: 0; margin: 0; width: auto; font-weight: bold;
      cursor: pointer;
    }
    .grid-inputs {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>Meal Builder</h1>

  <!-- Dashboard de Macros com Metas -->
  <div class="grid">
    <div class="card full-width">
      <div class="sub">Energia total</div>
      <div class="val" id="kcal-val">0 kcal</div>
      <div class="sub" id="target-kcal-label">Meta: 1800 kcal</div>
    </div>
    <div class="card">
      <div class="sub">Carboidratos</div>
      <div class="val" id="carb-val">0 g</div>
      <div class="sub" id="target-carb-label">Meta: 200g</div>
    </div>
    <div class="card">
      <div class="sub">Proteínas</div>
      <div class="val" id="prot-val">0 g</div>
      <div class="sub" id="target-prot-label">Meta: 130g</div>
    </div>
    <div class="card full-width">
      <div class="sub">Gorduras Totais</div>
      <div class="val" id="fat-val">0 g</div>
      <div class="sub" id="target-fat-label">Meta: 60g</div>
    </div>
  </div>

  <!-- Adicionar ao Prato -->
  <div class="card">
    <h3>Adicionar ao Prato</h3>
    
    <label for="food-input">Nome do Alimento</label>
    <div class="grid-inputs">
      <input type="text" id="food-input" placeholder="Ex: Ovo, Peito de frango..." autocomplete="off">
      <input type="number" id="portion-input" value="100" min="1" placeholder="Gramas">
    </div>

    <button id="search-btn" type="button">Buscar e Adicionar</button>
  </div>

  <!-- Tabela de Alimentos do Prato -->
  <div class="card">
    <h3>Refeições de Hoje</h3>
    <table>
      <thead>
        <tr>
          <th>Alimento</th>
          <th>Qtd</th>
          <th>Prot</th>
          <th>Kcal</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="meals-table-body">
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
