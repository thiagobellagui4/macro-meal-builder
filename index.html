<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro Meal Builder</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #2e7d32;
      --accent-hover: #388e3c;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 30px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .full-width { grid-column: span 2; }
    .val { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    .sub { font-size: 0.8rem; color: var(--subtext); }
    
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: var(--subtext); }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      background-color: var(--accent);
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    button:active { background-color: var(--accent-hover); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); }
    th { color: var(--subtext); }
    .btn-del {
      background: none; border: none; color: #ff5252;
      padding: 0; margin: 0; width: auto; font-weight: bold;
    }
    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>Meal Builder</h1>

  <!-- Dashboard de Macros -->
  <div class="grid">
    <div class="card full-width">
      <div class="sub">Energy total</div>
      <div class="val" id="kcal-val">0 kcal</div>
      <div class="sub" id="target-kcal-label">Daily target around 1,800 kcal</div>
    </div>
    <div class="card">
      <div class="sub">Carbohydrates</div>
      <div class="val" id="carb-val">0 g</div>
      <div class="sub" id="target-carb-label">Goal: --</div>
    </div>
    <div class="card">
      <div class="sub">Protein</div>
      <div class="val" id="prot-val">0 g</div>
      <div class="sub" id="target-prot-label">Goal: 130g+ daily</div>
    </div>
    <div class="card full-width">
      <div class="sub">Total fat</div>
      <div class="val" id="fat-val">0 g</div>
      <div class="sub" id="target-fat-label">Goal: --</div>
    </div>
  </div>

  <!-- Adicionar ao Prato -->
  <div class="card">
    <h3>Adicionar ao Prato</h3>
    <label>Selecione o alimento</label>
    <select id="food-select"></select>

    <label>Quantidade em gramas</label>
    <input type="number" id="food-grams" value="150">

    <button onclick="addPortion()">+ Adicionar ao prato</button>
  </div>

  <!-- Prato Ativo -->
  <div class="card">
    <h3>Itens do Prato</h3>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>(g)</th>
          <th>kcal</th>
          <th>P</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="plate-table"></tbody>
    </table>
    <button onclick="clearPlate()" style="background-color: #444; margin-top: 15px;">Limpar Prato</button>
  </div>

  <!-- Ajustar Metas Diárias -->
  <div class="card">
    <h3>Editar Minhas Metas</h3>
    <div class="grid-inputs">
      <div>
        <label>Meta Calorias (kcal)</label>
        <input type="number" id="goal-kcal" placeholder="1800">
      </div>
      <div>
        <label>Meta Proteínas (g)</label>
        <input type="number" id="goal-prot" placeholder="130">
      </div>
      <div>
        <label>Meta Carboidratos (g)</label>
        <input type="number" id="goal-carb" placeholder="200">
      </div>
      <div>
        <label>Meta Gorduras (g)</label>
        <input type="number" id="goal-fat" placeholder="50">
      </div>
    </div>
    <button onclick="saveGoals()" style="background-color: #f57c00;">Salvar Novas Metas</button>
  </div>

  <!-- Cadastrar Novo Alimento -->
  <div class="card">
    <h3>Cadastrar Novo Alimento</h3>
    <label>Nome do Alimento</label>
    <input type="text" id="new-name" placeholder="Ex: Patinho moído">

    <div class="grid-inputs">
      <div>
        <label>Calorias / 100g</label>
        <input type="number" id="new-kcal" placeholder="kcal">
      </div>
      <div>
        <label>Proteína / 100g</label>
        <input type="number" id="new-prot" placeholder="g">
      </div>
      <div>
        <label>Carboidrato / 100g</label>
        <input type="number" id="new-carb" placeholder="g">
      </div>
      <div>
        <label>Gordura / 100g</label>
        <input type="number" id="new-fat" placeholder="g">
      </div>
    </div>

    <button onclick="addNewFood()" style="background-color: #1976d2;">+ Cadastrar Alimento</button>
  </div>

  <script>
    const defaultFoods = [
      { id: 1, name: "Filé de frango", kcal: 166.6, carb: 0, prot: 30.6, fat: 3.6 },
      { id: 2, name: "Carne moída", kcal: 213.3, carb: 0, prot: 26, fat: 11.3 },
      { id: 3, name: "Filé de tilápia", kcal: 126.6, carb: 0, prot: 25.3, fat: 2.6 },
      { id: 4, name: "Carne suína", kcal: 200, carb: 0, prot: 28.6, fat: 8.6 },
      { id: 5, name: "Arroz branco", kcal: 130, carb: 28, prot: 2.5, fat: 0.3 },
      { id: 6, name: "Refogados", kcal: 36.6, carb: 7.3, prot: 1.3, fat: 0.3 },
      { id: 7, name: "Queijo muçarela", kcal: 262.5, carb: 2.5, prot: 22.5, fat: 25 }
    ];

    const defaultGoals = { kcal: 1800, prot: 130, carb: 200, fat: 50 };

    let customFoods = JSON.parse(localStorage.getItem('macro_custom_foods')) || defaultFoods;
    let activePlate = JSON.parse(localStorage.getItem('macro_plate')) || [];
    let userGoals = JSON.parse(localStorage.getItem('macro_user_goals')) || defaultGoals;

    function populateDropdown() {
      const selectEl = document.getElementById('food-select');
      selectEl.innerHTML = '';
      customFoods.forEach((item, index) => {
        let opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.name;
        selectEl.appendChild(opt);
      });
    }

    function loadGoalsUI() {
      document.getElementById('goal-kcal').value = userGoals.kcal || '';
      document.getElementById('goal-prot').value = userGoals.prot || '';
      document.getElementById('goal-carb').value = userGoals.carb || '';
      document.getElementById('goal-fat').value = userGoals.fat || '';

      document.getElementById('target-kcal-label').textContent = `Daily target around ${userGoals.kcal || 0} kcal`;
      document.getElementById('target-prot-label').textContent = `Goal: ${userGoals.prot || 0}g+ daily`;
      document.getElementById('target-carb-label').textContent = `Goal: ${userGoals.carb || 0}g daily`;
      document.getElementById('target-fat-label').textContent = `Goal: ${userGoals.fat || 0}g daily`;
    }

    function saveGoals() {
      userGoals = {
        kcal: parseFloat(document.getElementById('goal-kcal').value) || 0,
        prot: parseFloat(document.getElementById('goal-prot').value) || 0,
        carb: parseFloat(document.getElementById('goal-carb').value) || 0,
        fat: parseFloat(document.getElementById('goal-fat').value) || 0
      };

      localStorage.setItem('macro_user_goals', JSON.stringify(userGoals));
      loadGoalsUI();
      alert('Metas atualizadas com sucesso!');
    }

    function addNewFood() {
      const name = document.getElementById('new-name').value.trim();
      const kcal = parseFloat(document.getElementById('new-kcal').value) || 0;
      const prot = parseFloat(document.getElementById('new-prot').value) || 0;
      const carb = parseFloat(document.getElementById('new-carb').value) || 0;
      const fat = parseFloat(document.getElementById('new-fat').value) || 0;

      if (!name) {
        alert('Digite o nome do alimento!');
        return;
      }

      const newObj = { id: Date.now(), name, kcal, carb, prot, fat };
      customFoods.push(newObj);
      localStorage.setItem('macro_custom_foods', JSON.stringify(customFoods));

      document.getElementById('new-name').value = '';
      document.getElementById('new-kcal').value = '';
      document.getElementById('new-prot').value = '';
      document.getElementById('new-carb').value = '';
      document.getElementById('new-fat').value = '';

      populateDropdown();
      alert('Alimento cadastrado com sucesso!');
    }

    function addPortion() {
      const foodIndex = document.getElementById('food-select').value;
      const grams = parseFloat(document.getElementById('food-grams').value) || 0;
      if (grams <= 0 || foodIndex === "") return;

      const base = customFoods[foodIndex];
      const factor = grams / 100;

      const item = {
        id: Date.now(),
        name: base.name,
        grams: grams,
        kcal: base.kcal * factor,
        carb: base.carb * factor,
        prot: base.prot * factor,
        fat: base.fat * factor
      };

      activePlate.push(item);
      saveAndUpdate();
    }

    function removeItem(id) {
      activePlate = activePlate.filter(item => item.id !== id);
      saveAndUpdate();
    }

    function clearPlate() {
      activePlate = [];
      saveAndUpdate();
    }

    function saveAndUpdate() {
      localStorage.setItem('macro_plate', JSON.stringify(activePlate));
      render();
    }

    function render() {
      const tableBody = document.getElementById('plate-table');
      tableBody.innerHTML = '';

      let totals = { kcal: 0, carb: 0, prot: 0, fat: 0 };

      activePlate.forEach(item => {
        totals.kcal += item.kcal;
        totals.carb += item.carb;
        totals.prot += item.prot;
        totals.fat += item.fat;

        let row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.name}</td>
          <td>${item.grams}</td>
          <td>${item.kcal.toFixed(1)}</td>
          <td>${item.prot.toFixed(1)}g</td>
          <td><button class="btn-del" onclick="removeItem(${item.id})">✕</button></td>
        `;
        tableBody.appendChild(row);
      });

      document.getElementById('kcal-val').textContent = `${totals.kcal.toFixed(1)} kcal`;
      document.getElementById('carb-val').textContent = `${totals.carb.toFixed(1)} g`;
      document.getElementById('prot-val').textContent = `${totals.prot.toFixed(1)} g`;
      document.getElementById('fat-val').textContent = `${totals.fat.toFixed(1)} g`;
    }

    populateDropdown();
    loadGoalsUI();
    render();

    // Registro do Service Worker para suporte Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
