  <!-- Adicionar Alimento -->
  <div class="card">
    <h3 style="margin-top:0; font-size:1rem; color:var(--subtext);">+ Adicionar Alimento</h3>
    <div class="autocomplete-container">
      <input type="text" id="food-input" placeholder="Digite o nome (ex: Arroz, Frango)..." autocomplete="off">
      <div id="food-suggestions" class="suggestions-box"></div>
    </div>
    
    <input type="number" id="portion-input" value="100" placeholder="Gramas">
    <div class="grid-2" style="margin-top: 8px;">
      <button id="search-btn" type="button">Buscar na Web</button>
      <button id="open-manual-btn" type="button" style="background: var(--accent-blue);">+ Manual</button>
    </div>
  </div>

  <!-- Modal / Bloco de Cadastro Manual (Fica oculto até clicar no botão) -->
  <div class="card" id="manual-card" style="display: none; border: 1px dashed var(--accent-blue);">
    <h3 style="margin-top:0; font-size:1rem; color:var(--accent-blue);">Cadastro Manual de Alimento</h3>
    <span class="label-top">Informe os valores para 100g do alimento:</span>
    
    <input type="text" id="manual-name" placeholder="Nome do Alimento" style="margin-bottom: 8px;">
    
    <div class="grid-2">
      <div>
        <span class="label-top">Calorias (kcal)</span>
        <input type="number" id="manual-kcal" placeholder="0">
      </div>
      <div>
        <span class="label-top">Proteínas (g)</span>
        <input type="number" id="manual-prot" placeholder="0">
      </div>
    </div>
    
    <div class="grid-2" style="margin-top: 8px;">
      <div>
        <span class="label-top">Carboidratos (g)</span>
        <input type="number" id="manual-carb" placeholder="0">
      </div>
      <div>
        <span class="label-top">Gorduras (g)</span>
        <input type="number" id="manual-fat" placeholder="0">
      </div>
    </div>

    <div class="grid-2" style="margin-top: 12px;">
      <button id="save-manual-btn" type="button" style="background: var(--accent-green);">Adicionar à Refeição</button>
      <button id="cancel-manual-btn" type="button" style="background: #64748b;">Cancelar</button>
    </div>
  </div>
