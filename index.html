<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriMeta</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-orange: #f59e0b;
      --accent-pink: #ec4899;
      --secondary: #475569;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0 auto;
      max-width: 480px;
      padding: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .val-row { display: flex; justify-content: space-between; margin: 6px 0 10px; }
    .val { font-size: 1.25rem; font-weight: 800; }
    .sub { font-size: 0.8rem; color: var(--subtext); }
    .progress-bar-bg { width: 100%; height: 8px; background-color: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; border-radius: 999px; transition: width 0.4s ease; }
    .fill-kcal { background-color: var(--accent-orange); }
    .fill-prot { background-color: var(--accent-green); }
    .fill-carb { background-color: var(--accent-blue); }
    .fill-fat { background-color: var(--accent-pink); }
    input, button {
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: none; box-sizing: border-box; font-size: 0.95rem;
    }
    input { background: var(--input-bg); color: var(--text); }
    button { background: var(--accent-green); color: #fff; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.88rem; }
    th, td { padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: left; }
    .btn-del { background: transparent; color: #ef4444; border: none; cursor: pointer; font-size: 0.8rem; padding: 4px; width: auto; margin: 0; }
  </style>
</head>
<body>
  <h1>NutriMeta</h1>
  
  <!-- Painel de Calorias -->
  <div class="card">
    <span>Energia Total</span>
    <div class="val-row">
      <span class="val"><span id="kcal-val">0</span> / <span id="kcal-meta">2000</span> kcal</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill fill-kcal" id="kcal-bar"></div></div>
  </div>

  <!-- Painel de Macronutrientes -->
  <div class="grid-2">
    <div class="card" style="margin-bottom:0;">
      <span class="sub">Proteínas</span>
      <div class="val-row"><span class="val" style="font-size:1.05rem;"><span id="prot-val">0</span>g</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill fill-prot" id="prot-bar"></div></div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <span class="sub">Carboidratos</span>
      <div class="val-row"><span class="val" style="font-size:1.05rem;"><span id="carb-val">0</span>g</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill fill-carb" id="carb-bar"></div></div>
    </div>
  </div>

  <div class="card" style="margin-top: 16px;">
    <h3>+ Adicionar Alimento</h3>
    <input type="text" id="food-input" placeholder="Digite o nome (ex: Arroz, Frango, Aveia)...">
    <input type="number" id="portion-input" value="100" placeholder="Gramas">
    <button id="search-btn" type="button">Buscar e Adicionar</button>
  </div>

  <div class="card">
    <h3>Refeições Registradas</h3>
    <table>
      <thead>
        <tr><th>Alimento</th><th>Qtd</th><th>Prot</th><th>Kcal</th><th></th></tr>
      </thead>
      <tbody id="meals-table-body"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
